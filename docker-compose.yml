# Local infrastructure. Dev-only credentials: never reuse them anywhere real.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      CRA_DATABASE_URL: postgresql://cra:cra_dev_only@db:5432/cra
    volumes:
      - ./traces:/app/traces
    depends_on: [db]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: cra_dev_only
      POSTGRES_DB: cra
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: