# Local infrastructure. Dev-only credentials: never reuse them anywhere real.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./traces:/app/traces
    depends_on: [qdrant, postgres]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - ./qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: cra_dev_only
      POSTGRES_DB: cra
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
